name: ambro_website
description: Ambro official Flutter Web homepage
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.0
  url_launcher: ^6.2.0
  google_fonts: ^6.1.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/blog/
    - assets/content/blog/java/
    - assets/content/blog/python/
    - assets/content/blog/ai-basic/
    - assets/content/blog/ai-insight/
